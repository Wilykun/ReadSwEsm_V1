name: CI

on:
  push:
    branches: [refactor/full-esm, ReadSwDika_V43]
  pull_request:
    branches: [refactor/full-esm, ReadSwDika_V43]
  workflow_dispatch:

jobs:
  test:
    name: Install + validasi (no bug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Info versi
        run: node --version && npm --version

      - name: Arahkan lockfile ke registry npm publik
        # package-lock.json berisi URL mirror internal Replit (package-firewall.replit.*)
        # yang hanya bisa diakses dari dalam Replit. Di GitHub Actions URL itu mati,
        # jadi tulis ulang ke registry.npmjs.org (hanya di workspace CI, tidak di-commit).
        # Path tarball-nya identik, versi & hash integrity tidak berubah.
        run: |
          sed -i 's|http://package-firewall.replit.internal/npm|https://registry.npmjs.org|g' package-lock.json
          sed -i 's|http://package-firewall.replit.local/npm|https://registry.npmjs.org|g' package-lock.json
          grep -c "package-firewall" package-lock.json || echo "0 URL Replit tersisa (bagus)"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verifikasi install lengkap
        run: |
          node -e "for (const m of ['axios','pino','sharp','ws','qrcode-terminal','@whiskeysockets/baileys']) require.resolve(m, { paths: [process.cwd()] })"
          echo "Semua modul inti ter-resolve, install lengkap"

      - name: Bulk validasi semua file .js (ESM import)
        run: npm run validate

      - name: Validasi sistem plugin (pengganti switch-case)
        run: node scripts/check-plugins.js

      - name: Cek inline logic di case message.js
        run: node scripts/check-inline-cases.js

      - name: Syntax check semua file .js
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print | xargs -n1 node --check
          echo "Semua file .js lolos syntax check"

      - name: Cek variabel tak terdefinisi (ESLint no-undef)
        # node --check hanya cek syntax, tidak cek scope.
        # no-undef menangkap ReferenceError seperti `pfx` / `commands`
        # yang lolos semua cek di atas tapi crash saat runtime.
        # Install --no-save agar package.json/lockfile tetap bersih.
        run: |
          npm install --no-save --no-audit --no-fund eslint globals
          npx eslint .
          echo "Tidak ada variabel tak terdefinisi"
